version: "3"

services:
  automation_backend:
    build: .
    restart: always
    image: automation_backend_image
    container_name: automation-backend
    ports:
      - "8052:8000"  # UPDATED: Using 8052 because 8051 is currently in use on your server
    volumes:
      - .:/app/
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@automation_db:5432/automation_db
      - REDIS_HOST=automation_redis
      - REDIS_PORT=6379
    depends_on:
      - automation_db
      - automation_redis
    networks:
      - ims_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  automation_db:
    image: postgres:15
    restart: always
    container_name: automation-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: automation_db
    volumes:
      - automation_pg_data:/var/lib/postgresql/data
    networks:
      - ims_network

  automation_redis:
    image: redis:alpine
    restart: always
    container_name: automation-redis
    ports:
      - "6327:6379" # Using 6327 (checked and free)
    networks:
      - ims_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: automation-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5055:80"
    depends_on:
      - automation_db
    networks:
      - ims_network

volumes:
  automation_pg_data:

networks:
  ims_network:
    external: true
